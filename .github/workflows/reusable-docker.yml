
name: Reusable Docker Build

on:
  workflow_call:

    inputs:

      runner:
        description: GitHub runner
        type: string
        default: ubuntu-latest
        required: false

      registry:
        description: Docker registry
        type: string
        default: ghcr.io
        required: false

      registry-username:
        description: Registry username
        type: string
        required: true

      image-name:
        description: Image name without registry
        type: string
        required: true

      image-tag:
        description: Image tag
        type: string
        default: latest
        required: false

      context:
        description: Docker build context
        type: string
        default: .
        required: false

      dockerfile:
        description: Dockerfile path
        type: string
        default: Dockerfile
        required: false

      platforms:
        description: Build platforms
        type: string
        default: linux/amd64
        required: false

      push:
        description: Push image
        type: boolean
        default: false
        required: false

      load:
        description: Load image into Docker
        type: boolean
        default: true
        required: false

      save-artifact:
        description: Save Docker image artifact
        type: boolean
        default: false
        required: false

      artifact-name:
        description: Docker artifact name
        type: string
        default: docker-image
        required: false

      cache:
        description: Enable GitHub cache
        type: boolean
        default: true
        required: false

    secrets:

      registry-password:
        required: true

    outputs:

      image:
        description: Full image name
        value: ${{ jobs.build.outputs.image }}

      digest:
        description: Image digest
        value: ${{ jobs.build.outputs.digest }}

      tags:
        description: Docker tags
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ${{ inputs.runner }}

    outputs:

      image: ${{ steps.meta.outputs.tags }}

      digest: ${{ steps.build.outputs.digest }}

      tags: ${{ steps.meta.outputs.tags }}

    steps:

      ##########################################################

      - uses: actions/checkout@v4

      ##########################################################

      - uses: docker/setup-qemu-action@v3

      ##########################################################

      - uses: docker/setup-buildx-action@v3

      ##########################################################

      - name: Login

        uses: docker/login-action@v3

        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password }}

      ##########################################################

      - name: Docker Metadata

        id: meta

        uses: docker/metadata-action@v5

        with:

          images: |
            ${{ inputs.registry }}/${{ inputs.registry-username }}/${{ inputs.image-name }}

          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha

      ##########################################################

      - name: Build Image

        id: build

        uses: docker/build-push-action@v6

        with:

          context: ${{ inputs.context }}

          file: ${{ inputs.dockerfile }}

          platforms: ${{ inputs.platforms }}

          push: ${{ inputs.push }}

          load: ${{ inputs.load }}

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: ${{ inputs.cache && 'type=gha' || '' }}

          cache-to: ${{ inputs.cache && 'type=gha,mode=max' || '' }}

      ##########################################################

      - name: Save Docker Image

        if: inputs.save-artifact

        run: |

          docker save \
          $(echo "${{ steps.meta.outputs.tags }}" | head -n1) \
          -o image.tar

      ##########################################################

      - name: Upload Docker Artifact

        if: inputs.save-artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ inputs.artifact-name }}

          path: image.tar

      ##########################################################

      - name: Summary

        run: |

          echo "## Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "|Property|Value|" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "|Image|${{ steps.meta.outputs.tags }}|" >> $GITHUB_STEP_SUMMARY
          echo "|Registry|${{ inputs.registry }}|" >> $GITHUB_STEP_SUMMARY
          echo "|Push|${{ inputs.push }}|" >> $GITHUB_STEP_SUMMARY
          echo "|Platforms|${{ inputs.platforms }}|" >> $GITHUB_STEP_SUMMARY