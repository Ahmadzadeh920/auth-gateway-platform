name: Reusable Deployment

on:
  workflow_call:

    inputs:

      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
        required: false

      deployment-type:
        description: docker-compose | kubernetes | helm
        type: string
        required: true

      environment:
        description: Deployment environment
        type: string
        required: true

      image:
        description: Full image name
        type: string
        required: true

      image-tag:
        description: Image tag
        type: string
        default: latest
        required: false

      compose-file:
        description: Docker Compose file
        type: string
        default: docker-compose.yml
        required: false

      compose-service:
        description: Docker Compose service
        type: string
        default: ""
        required: false

      kubernetes-manifest:
        description: Kubernetes manifest directory or file
        type: string
        default: ""
        required: false

      namespace:
        description: Kubernetes namespace
        type: string
        default: default
        required: false

      helm-release:
        description: Helm release name
        type: string
        default: ""
        required: false

      helm-chart:
        description: Helm chart path
        type: string
        default: ""
        required: false

      timeout-minutes:
        description: Job timeout
        type: number
        default: 30
        required: false

    secrets:

      ssh-host:
        required: false

      ssh-user:
        required: false

      ssh-private-key:
        required: false

      kubeconfig:
        required: false

permissions:
  contents: read

jobs:

  deploy:

    runs-on: ${{ inputs.runner }}

    environment: ${{ inputs.environment }}

    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:

      ###########################################################
      # Checkout
      ###########################################################

      - uses: actions/checkout@v4

      ###########################################################
      # Docker Compose Deployment
      ###########################################################

      - name: Configure SSH
        if: inputs.deployment-type == 'docker-compose'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}

      - name: Deploy Docker Compose
        if: inputs.deployment-type == 'docker-compose'

        shell: bash

        run: |

          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.ssh-user }}@${{ secrets.ssh-host }} <<EOF

          export IMAGE=${{ inputs.image }}
          export TAG=${{ inputs.image-tag }}

          docker compose \
          -f ${{ inputs.compose-file }} \
          pull

          docker compose \
          -f ${{ inputs.compose-file }} \
          up -d

          EOF

      ###########################################################
      # Kubernetes
      ###########################################################

      - name: Configure kubeconfig
        if: inputs.deployment-type == 'kubernetes'

        shell: bash

        run: |

          mkdir -p ~/.kube

          echo "${{ secrets.kubeconfig }}" > ~/.kube/config

      - name: Deploy Kubernetes
        if: inputs.deployment-type == 'kubernetes'

        run: |

          kubectl apply \
          -f ${{ inputs.kubernetes-manifest }}

          kubectl rollout status deployment \
          --all \
          -n ${{ inputs.namespace }}

      ###########################################################
      # Helm
      ###########################################################

      - name: Configure kubeconfig (Helm)
        if: inputs.deployment-type == 'helm'

        shell: bash

        run: |

          mkdir -p ~/.kube

          echo "${{ secrets.kubeconfig }}" > ~/.kube/config

      - name: Helm Upgrade
        if: inputs.deployment-type == 'helm'

        run: |

          helm upgrade \
          --install \
          ${{ inputs.helm-release }} \
          ${{ inputs.helm-chart }} \
          --namespace ${{ inputs.namespace }} \
          --set image.repository=${{ inputs.image }} \
          --set image.tag=${{ inputs.image-tag }}

      ###########################################################
      # Summary
      ###########################################################

      - name: Deployment Summary
        if: always()

        run: |

          {
            echo "## Deployment Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Deployment Type | ${{ inputs.deployment-type }} |"
            echo "| Image | ${{ inputs.image }} |"
            echo "| Tag | ${{ inputs.image-tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"