
name: Auth Gateway CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: api-gateway


jobs:
###############################################################################
# 1. TEST JOB
###############################################################################
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]


    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-gateway/requirements.txt
          pip install ruff

      - name: Lint
        run: |
          ruff check . --fix

      - name: Run Tests
        working-directory: services/api-gateway
        run: |
          pytest \
            --junitxml=tests/test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            services/api-gateway/tests/test-results.xml
            services/api-gateway/tests/coverage.xml

###############################################################################
# 2. CODEQL
###############################################################################


  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  



###############################################################################
# 3. SONARQUBE
###############################################################################
  sonarqube:
    name: SonarQube Scan
    needs: test
    runs-on:
      - self-hosted
      - linux

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Download Test Reports
        uses: actions/download-artifact@v5
        with:
          name: test-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

###############################################################################
# 4. DOCKER BUILD
###############################################################################
 
  docker-build:
    name: Build & Publish Docker Image
    needs: 
      - test
      - codeql
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      
      - name: Convert repository owner to lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/api-gateway


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Info
        run: | 
          docker version
          docker info

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: false
          load: true
          tags: $ {{ steps.meta.outputs.tags }}
          labels: $ {{ steps.meta.outputs.labels }}
                
          cache-from: type=gha
          cache-to: type=gha,mode=max
       #########################################################################
      # Save Docker Image
      #########################################################################
      - name: Save Docker Image
        run: |
          docker save \
          ghcr.io/${{ env.OWNER_LC }}/api-gateway:latest \
          -o api-gateway.tar

      #########################################################################
      # Upload Docker Artifact
      #########################################################################
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: api-gateway.tar
      
      #########################################################################
      # Push Image to GHCR
      #########################################################################
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha  