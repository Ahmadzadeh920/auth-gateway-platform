name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

###############################################################################
# Test
###############################################################################

  test:

    name: Test

    uses: ./.github/workflows/reusable-test.yml

    with:

      runner: ubuntu-latest

      python-versions: '["3.11","3.12"]'

      working-directory: services/api-gateway

      requirements-file: requirements.txt

      lint: true

      run-tests: true

      artifact-name: api-test-results

###############################################################################
# CodeQL
###############################################################################

  codeql:

    name: CodeQL

    needs: test
    permissions:
      contents: read
      actions: read
      security-events: write

    uses: ./.github/workflows/reusable-codeql.yml

    with:

      runner: ubuntu-latest

      languages: python

      build-mode: none

###############################################################################
# SonarQube
###############################################################################

  sonarqube:

    name: SonarQube

    needs: test

    uses: ./.github/workflows/reusable-sonarqube.yml

    with:

      runner: sonar
      project-base-dir: .

      download-artifact: true

      artifact-name: api-test-results-3.12

      quality-gate: true

    secrets:

      sonar-token: ${{ secrets.SONAR_TOKEN }}

      sonar-host-url: ${{ secrets.SONAR_HOST_URL }}

###############################################################################
# Docker Build
###############################################################################

  docker-build:

    name: Docker Build

    needs:

      - test
      - codeql

    uses: ./.github/workflows/reusable-docker-build.yml

    with:

      runner: ubuntu-latest

      context: services/api-gateway

      dockerfile: services/api-gateway/Dockerfile

      image-name: api-gateway

      image-tag: latest

      save-artifact: true

      artifact-name: docker-image

###############################################################################
# Trivy
###############################################################################

  trivy:

    name: Trivy Scan

   
    permissions:
      contents: read
      security-events: write

    needs: docker-build

    uses: ./.github/workflows/reusable-trivy.yml

    with:

      scan-type: image

      scan-target: ${{ needs.docker-build.outputs.image }}

      download-artifact: true

      artifact-name: ${{ needs.docker-build.outputs.artifact-name }}

      severity: HIGH,CRITICAL

      scanners: vuln,secret

      report-artifact-name: trivy-results

  convert-owner:

      name: Convert Repository Owner to Lowercase

      runs-on: ubuntu-latest

      outputs:
        owner: ${{ steps.owner.outputs.owner }}

      steps:

        - name: Convert owner
          id: owner
          shell: bash
          run: |
            echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"



###############################################################################
# Docker Push
###############################################################################

  docker-push:

    name: Docker Push

    needs: 
      - trivy
      - docker-build
      - convert-owner
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/reusable-docker-push.yml

    with:

      runner: ubuntu-latest

      registry: ghcr.io

      registry-username:  ${{ needs.convert-owner.outputs.owner }}

      image-name: ${{ needs.docker-build.outputs.image-name }}

      image-tag: ${{ needs.docker-build.outputs.image-tag }}

      artifact-name: ${{ needs.docker-build.outputs.artifact-name }}

    secrets:

      registry-password: ${{ secrets.GITHUB_TOKEN }}

###############################################################################
# Deploy
###############################################################################

  # deploy:

  #   name: Deploy

  #   needs: 
  #     - docker-build
  #     - docker-push


  #   uses: ./.github/workflows/reusable-deploy.yml

  #   with:

  #     deployment-type: docker-compose

  #     environment: production

  #     image: ${{ needs.docker-push.outputs.image }}

  #     image-tag: ${{ needs.docker-build.outputs.image-tag }}

  #     compose-file: docker-compose.yml

  #   secrets:

  #     ssh-host: ${{ secrets.SERVER_HOST }}

  #     ssh-user: ${{ secrets.SERVER_USER }}

  #     ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}



###############################################################################
# deploy with helm
###############################################################################
  deploy-helm:

    name: Deploy helm 
    needs: 
      - docker-build
      - docker-push
    uses: ./.github/workflows/reusable-deploy-helm.yml
    with: 
      runner: self-hosted
      application: auth-gateway 
      namespace: myapp
      helm-chart: ./helm/auth-gateway 
      values-file: ./helm/auth-gateway/values.yaml 
      image-repository: ghcr.io/ahmadzadeh920/api-gateway 
      image-tag: ${{ github.sha }} 
     

###############################################################################
# deploy with Kubernetes
###############################################################################

  deploy-Kubernetes:
    name: Deploy Kubernetes 
    needs: 
      - docker-build
      - docker-push
    uses: ./.github/workflows/reusable-deploy-kubernetes.yml
    with:
      runner: self-hosted
      application: auth-gateway
      namespace: myapp
      manifest: ./k8s
      image-repository: ghcr.io/ahmadzadeh920/auth-gateway
      image-tag: ${{ github.sha }}
     
###############################################################################
# deploy with docker-compose 
###############################################################################

  deploy-docker-compose:
    name: Deploy docker compose 
    needs: 
      - docker-build
      - docker-push
    uses: ./.github/workflows/reusable-deploy-docker-compose.yml
    with:
      runner: ubuntu-latest
      environment: production
      compose-file: docker-compose.yml
      image: ghcr.io/ahmadzadeh920/auth-gateway
      image-tag: ${{ github.sha }}
    secrets:
      ssh-host: ${{ secrets.SSH_HOST }}
      ssh-user: ${{ secrets.SSH_USER }}
      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
     

###############################################################################
# Repository Sync
###############################################################################

  sync:

    name: Repository Sync

    needs: 
      - Deploy-Kubernetes 

    uses: ./.github/workflows/reusable-sync.yml

    with:

      source-branch: main

      target-branch: release

      target-repository: company/deployment

    secrets:

      target-token: ${{ secrets.REPO_SYNC_TOKEN }}




###############################################################################
# Notification
###############################################################################
