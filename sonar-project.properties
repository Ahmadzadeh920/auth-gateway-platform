# sonar-project.properties
# Place this file in the root of the repository.
# -----------------------------------------------
# SonarCloud / SonarQube project identity
# -----------------------------------------------
# Replace <YOUR_ORGANIZATION> and <YOUR_PROJECT_KEY> with values from your
# SonarCloud organisation settings (or your self-hosted Sonar server).
sonar.organization=<YOUR_ORGANIZATION>
sonar.projectKey=<YOUR_PROJECT_KEY>
sonar.projectName=auth-gateway-platform

# -----------------------------------------------
# Source & language
# -----------------------------------------------
sonar.sources=services/api-gateway/app
sonar.tests=services/api-gateway/tests
sonar.language=py
sonar.python.version=3.11, 3.12

# -----------------------------------------------
# Exclusions
# -----------------------------------------------
# Exclude generated files, migrations, and third-party config from analysis
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  docker/**,\
  deployments/**,\
  **/node_modules/**

sonar.test.exclusions=\
  services/api-gateway/tests/**

# -----------------------------------------------
# Coverage & test reports
# (paths can also be passed via CLI args in the workflow)
# -----------------------------------------------
sonar.python.coverage.reportPaths=services/api-gateway/tests/coverage.xml
sonar.python.xunit.reportPath=services/api-gateway/tests/test-results.xml

# -----------------------------------------------
# Encoding
# -----------------------------------------------
sonar.sourceEncoding=UTF-8
