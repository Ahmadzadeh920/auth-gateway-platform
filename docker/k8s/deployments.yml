apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  namespace: myapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-gateway

  template:
    metadata:
      labels:
        app: auth-gateway

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: auth-gateway
          image: ghcr.io/ahmadzadeh920/api-gateway:9faba200b1e5c84201ca2ddf98711c61e40289af
          ports:
            - containerPort: 8000